<rect x="20" y="16" width="6" height="32" rx="3" fill="url(#g)"><animate attributeName="opacity" values="1;.5;1" dur="3s" repeatCount="indefinite"/></rect>
<text x="42" y="42" font-size="26" font-weight="700" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Learning Timeline</text>
