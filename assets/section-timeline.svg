<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img" aria-label="Learning Timeline">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#14b8a6"/></linearGradient></defs>
<style>.bar{transform-origin:0 0;animation:grow 1.2s ease-out forwards}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}</style>
