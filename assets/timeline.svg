<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Education timeline: Matric 2020, F.Sc Pre-Engineering 2022, BS.IT 2026">
<defs>
<linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.k{font-size:13px;letter-spacing:3px;fill:#8b949e;font-weight:600}
.y{font-size:16px;font-weight:700;fill:#e6edf3}
.h{font-size:20px;font-weight:700;fill:#e6edf3}
.s{font-size:14px;fill:#8b949e}
.r{font-size:15px;font-weight:700;fill:#14b8a6}
.n{opacity:0;animation:in .8s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.l{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 2.6s .2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
</style>
<rect x="1" y="1" width="1198" height="298" rx="20" fill="#0d1117" stroke="url(#g)" stroke-width="2"/>
<rect x="30" y="22" width="5" height="16" rx="2.5" fill="url(#g)"/>
<text x="46" y="35" class="k">EDUCATION TIMELINE</text>
<path d="M200 110 H1000" stroke="#30363d" stroke-width="4" stroke-linecap="round" fill="none"/>
<path class="l" d="M100 110 H1100" stroke="url(#g)" stroke-width="4" stroke-linecap="round" fill="none" transform="translate(0,0)"/>
<g class="n" style="animation-delay:0.6s">
<rect x="155" y="46" width="90" height="28" rx="14" fill="#161b22" stroke="url(#g)" stroke-width="1.5"/>
<text x="200" y="65" text-anchor="middle" class="y">2020</text>
<line x1="200" y1="74" x2="200" y2="98" stroke="#30363d" stroke-width="2"/>
<circle cx="200" cy="110" r="12" fill="#0d1117" stroke="url(#g)" stroke-width="4"/>
<rect x="30" y="160" width="340" height="110" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<rect x="30" y="160" width="340" height="4" rx="2" fill="url(#g)"/>
<text x="200" y="205" text-anchor="middle" class="h">Matric</text>
<text x="200" y="228" text-anchor="middle" class="s">Computer Science · Govt. High School</text>
<text x="200" y="252" text-anchor="middle" class="r">896 / 1100</text>
</g>
<g class="n" style="animation-delay:1.5s">
<rect x="555" y="46" width="90" height="28" rx="14" fill="#161b22" stroke="url(#g)" stroke-width="1.5"/>
<text x="600" y="65" text-anchor="middle" class="y">2022</text>
<line x1="600" y1="74" x2="600" y2="98" stroke="#30363d" stroke-width="2"/>
<circle cx="600" cy="110" r="12" fill="#0d1117" stroke="url(#g)" stroke-width="4"/>
<rect x="430" y="160" width="340" height="110" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<rect x="430" y="160" width="340" height="4" rx="2" fill="url(#g)"/>
<text x="600" y="205" text-anchor="middle" class="h">F.Sc Pre-Engineering</text>
<text x="600" y="228" text-anchor="middle" class="s">Govt. PGC Sahiwal</text>
<text x="600" y="252" text-anchor="middle" class="r">563 / 1100</text>
</g>
<g class="n" style="animation-delay:2.4s">
<rect x="955" y="46" width="90" height="28" rx="14" fill="#161b22" stroke="url(#g)" stroke-width="1.5"/>
<text x="1000" y="65" text-anchor="middle" class="y">2026</text>
<line x1="1000" y1="74" x2="1000" y2="98" stroke="#30363d" stroke-width="2"/>
<circle cx="1000" cy="110" r="12" fill="none" stroke="#14b8a6" stroke-width="2"><animate attributeName="r" values="12;24;12" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0;.8" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="1000" cy="110" r="12" fill="#0d1117" stroke="url(#g)" stroke-width="4"/>
<rect x="830" y="160" width="340" height="110" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<rect x="830" y="160" width="340" height="4" rx="2" fill="url(#g)"/>
<text x="1000" y="205" text-anchor="middle" class="h">BS.IT</text>
<text x="1000" y="228" text-anchor="middle" class="s">Virtual University of Pakistan</text>
<text x="1000" y="252" text-anchor="middle" class="r">CGPA 3.64 / 4.0</text>
</g>
</svg>